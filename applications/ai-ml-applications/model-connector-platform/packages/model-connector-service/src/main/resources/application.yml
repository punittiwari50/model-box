# Model Connector Service Configuration
server:
  port: 8095
  host: "0.0.0.0"
  corsOrigin: "*"

platform:
  urls:
    uiBaseUrl: "${UI_BASE_URL:http://localhost:3005}"
    serviceBaseUrl: "${SERVICE_BASE_URL:http://localhost:8095}"
    oauthCallbackUrl: "${OAUTH_CALLBACK_URL:http://localhost:8085/oauth2callback}"
    oauthAuthorizeChooserUrl: "${OAUTH_CHOOSER_URL:http://localhost:8085/oauth2/authorize}"
    ollamaOAuthBaseUrl: "${OLLAMA_OAUTH_BASE_URL:http://localhost:11436}"

cache:
  models:
    ttlHours: 24
    ttlMs: 86400000

tasks:
  lifecycle:
    heartbeatTimeoutSeconds: 30
    maxStalledTimeoutSeconds: 90
    pulseIntervalSeconds: 10

upstream:
  geminiModelConnector:
    url: "http://localhost:8090"
    timeoutMs: 10000

connector:
  defaultStrategy: "API"
  gemini:
    model: "gemini-3.8-flash"
  fallback:
    provider: "ollama"
    model: "llama3.2"
    baseUrl: "${OLLAMA_BASE_URL:http://localhost:11435}"
    cliCommand: "ollama"
  ollama:
    baseUrl: "${OLLAMA_BASE_URL:http://localhost:11435}"

logging:
  level: "info"
  format: "json"

# Declarative Multi-Model Provider Master Configurations
providers:
  google:
    name: "Google Cloud / Gemini"
    icon: "✨"
    authType: "oauth"
    baseUrl: "${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}"
    apiVersion: "v1beta"
    cliExecutable: "gemini"
    cliArgsTemplate: "-m {model} --non-interactive -o json"
    authEndpoint: "https://accounts.google.com/o/oauth2/v2/auth"
    tokenEndpoint: "https://oauth2.googleapis.com/token"
    userinfoEndpoint: "https://www.googleapis.com/oauth2/v2/userinfo"
    tokeninfoEndpoint: "https://oauth2.googleapis.com/tokeninfo"
    cliCommand: "gemini auth login --browser"
    defaultRedirectUri: "http://localhost:8085/oauth2callback"
    defaultScopes: "https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile"
    apiHeader: "Authorization"
    apiHeaderPrefix: "Bearer"
    docsUrl: "https://geminicli.com/docs/get-started/authentication/"
    modelKeywords: "gemini"
  anthropic:
    name: "Anthropic Claude"
    icon: "🧠"
    authType: "api_key"
    baseUrl: "${CLAUDE_API_BASE_URL:https://api.anthropic.com}"
    messagesEndpoint: "https://api.anthropic.com/v1/messages"
    apiVersion: "v1"
    anthropicVersionHeader: "2023-06-01"
    cliExecutable: "claude"
    cliArgsTemplate: "--model {model} --print --output-format json"
    authEndpoint: "https://claude.ai/oauth/authorize"
    tokenEndpoint: "https://api.anthropic.com/v1/oauth/token"
    userinfoEndpoint: "https://api.anthropic.com/v1/user"
    tokeninfoEndpoint: "https://api.anthropic.com/v1/models"
    cliCommand: "claude auth login"
    defaultRedirectUri: "http://localhost:8085/oauth2callback"
    defaultScopes: "user:read org:read"
    apiHeader: "x-api-key"
    apiHeaderPrefix: ""
    docsUrl: "https://docs.anthropic.com/"
    modelKeywords: "claude"
  github:
    name: "GitHub Copilot"
    icon: "🐙"
    authType: "oauth"
    baseUrl: "${COPILOT_API_BASE_URL:https://api.githubcopilot.com}"
    chatCompletionsEndpoint: "https://api.githubcopilot.com/chat/completions"
    apiVersion: "v1"
    cliExecutable: "github-copilot-cli"
    cliArgsTemplate: "--model {model} --non-interactive"
    authEndpoint: "https://github.com/login/oauth/authorize"
    tokenEndpoint: "https://github.com/login/oauth/access_token"
    userinfoEndpoint: "https://api.github.com/user"
    tokeninfoEndpoint: "https://api.github.com/user"
    cliCommand: "gh auth login --web"
    defaultRedirectUri: "http://localhost:8085/oauth2callback"
    defaultScopes: "read:user user:email copilot"
    apiHeader: "Authorization"
    apiHeaderPrefix: "token"
    docsUrl: "https://docs.github.com/en/copilot"
    modelKeywords: "copilot,github"
  openai:
    name: "OpenAI ChatGPT"
    icon: "🤖"
    authType: "api_key"
    baseUrl: "${OPENAI_API_BASE_URL:https://api.openai.com}"
    apiVersion: "v1"
    cliExecutable: "openai"
    cliArgsTemplate: "api chat.completions.create -m {model}"
    authEndpoint: "https://auth0.openai.com/authorize"
    tokenEndpoint: "https://auth0.openai.com/oauth/token"
    userinfoEndpoint: "https://api.openai.com/v1/me"
    tokeninfoEndpoint: "https://api.openai.com/v1/models"
    cliCommand: "openai login"
    defaultRedirectUri: "http://localhost:8085/oauth2callback"
    defaultScopes: "openid profile email model.request"
    apiHeader: "Authorization"
    apiHeaderPrefix: "Bearer"
    docsUrl: "https://platform.openai.com/docs/"
    modelKeywords: "gpt,chatgpt,o1,o3,openai"
  xai:
    name: "xAI Grok"
    icon: "⚡"
    authType: "api_key"
    baseUrl: "${GROK_API_BASE_URL:https://api.x.ai}"
    apiVersion: "v1"
    cliExecutable: "xai"
    cliArgsTemplate: "chat -m {model}"
    authEndpoint: "https://auth.x.ai/oauth/authorize"
    tokenEndpoint: "https://api.x.ai/oauth/token"
    userinfoEndpoint: "https://api.x.ai/v1/user"
    tokeninfoEndpoint: "https://api.x.ai/v1/models"
    cliCommand: "grok auth login"
    defaultRedirectUri: "http://localhost:8085/oauth2callback"
    defaultScopes: "openid email"
    apiHeader: "Authorization"
    apiHeaderPrefix: "Bearer"
    docsUrl: "https://docs.x.ai/"
    modelKeywords: "grok"
  ollama:
    name: "Ollama Local"
    icon: "🦙"
    authType: "none"
    baseUrl: "${OLLAMA_BASE_URL:http://localhost:11435}"
    oauthBaseUrl: "${OLLAMA_OAUTH_BASE_URL:http://localhost:11436}"
    fallbackBaseUrls: "http://host.docker.internal:11435,http://127.0.0.1:11435,http://localhost:11434"
    tagsPath: "/api/tags"
    generatePath: "/api/generate"
    cacheTtlHours: 24
    cacheTtlMs: 86400000
    apiVersion: "v1"
    cliExecutable: "ollama"
    cliArgsTemplate: "run {model}"
    cliCommand: "ollama"
    authEndpoint: "http://localhost:11436/ollama-oauth/authorize"
    tokenEndpoint: "http://localhost:11436/ollama-oauth/token"
    userinfoEndpoint: "http://localhost:11436/ollama-oauth/userinfo"
    tokeninfoEndpoint: "http://localhost:11436/ollama-oauth/tokeninfo"
    defaultRedirectUri: "http://localhost:8085/oauth2callback"
    defaultScopes: "local:read local:generate"
    apiHeader: "Authorization"
    apiHeaderPrefix: "Bearer"
    docsUrl: "https://ollama.com/"
    modelKeywords: "ollama,llama,lfm3,qwen,phi,gemma,minicpm,nemotron,deepseek,mistral"
  azure:
    name: "Microsoft Azure OpenAI AD"
    icon: "🟦"
    authType: "oauth"
    baseUrl: "https://cognitiveservices.azure.com"
