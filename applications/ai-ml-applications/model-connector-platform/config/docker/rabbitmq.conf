# ==============================================================================
# RabbitMQ Configuration
# Conforms to RabbitMQ 3.13+ / 4.x Configuration Standards
# ==============================================================================

# Disable deprecated legacy management metrics collection to eliminate deprecation warning:
#   [warning] Deprecated features: `management_metrics_collection`: Feature `management_metrics_collection` is deprecated.
deprecated_features.permit.management_metrics_collection = false

# Permit default guest user access across container network boundaries
loopback_users.guest = false
