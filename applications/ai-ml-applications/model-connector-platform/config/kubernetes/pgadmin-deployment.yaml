apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-connector-pgadmin
  namespace: model-box
  labels:
    app.kubernetes.io/name: model-connector-pgadmin
    app.kubernetes.io/component: database-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-connector-pgadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-connector-pgadmin
        app.kubernetes.io/component: database-admin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@modelbox.enterprise"
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-connector-secrets
                  key: PGADMIN_DEFAULT_PASSWORD
                  optional: true
            - name: PGADMIN_CONFIG_SERVER_MODE
              value: "False"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: model-connector-pgadmin
  namespace: model-box
  labels:
    app.kubernetes.io/name: model-connector-pgadmin
spec:
  type: ClusterIP
  ports:
    - port: 5050
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: model-connector-pgadmin
