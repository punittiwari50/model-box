apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-connectors-service
  namespace: model-box
  labels:
    app.kubernetes.io/name: model-connectors-service
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: model-connectors-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-connectors-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: service
          image: model-connectors-service:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8000"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
