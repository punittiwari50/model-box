apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-connectors-ui
  namespace: model-box
  labels:
    app.kubernetes.io/name: model-connectors-ui
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: model-connectors-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-connectors-ui
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: ui
          image: model-connectors-ui:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
