# Centralized Docker Compose for Service Backend Microservice
name: model-connectors-service

services:
  service:
    container_name: ${SERVICE_CONTAINER_NAME:-model-connectors-service}
    image: ${SERVICE_IMAGE_NAME:-model-connectors-service:latest}
    build:
      context: ../../service
      dockerfile: deploy/docker/Dockerfile
    restart: ${SERVICE_RESTART:-unless-stopped}
    ports:
      - "${MODEL_CONNECTORS_PORT:-8000}:${SERVICE_INTERNAL_PORT:-8000}"
    env_file:
      - ./model-box-service.env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - APP_PORT=${APP_PORT:-8000}
    networks:
      - model-box-net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8000}/health')" ]
      interval: ${SERVICE_HEALTHCHECK_INTERVAL:-15s}
      timeout: ${SERVICE_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${SERVICE_HEALTHCHECK_RETRIES:-3}
      start_period: ${SERVICE_HEALTHCHECK_START_PERIOD:-10s}

networks:
  model-box-net:
    name: ${SHARED_NETWORK_NAME:-model-box-net}
    external: true
