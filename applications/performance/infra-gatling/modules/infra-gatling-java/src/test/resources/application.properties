# Default local configuration for Ollama Gatling performance tests
# Override via environment-specific files: application-{profile}.properties

# Ollama API endpoint configuration
ollama.baseUrl=http://127.0.0.1:11435
ollama.model=auto
ollama.timeout=60
ollama.retries=3

# Load test configuration
gatling.warmupUsers=5
gatling.maxUsers=20
gatling.rampDuration=30
gatling.thinkTime=1000
gatling.timeout=30
gatling.requestPause=500
