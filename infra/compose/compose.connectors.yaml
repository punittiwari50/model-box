name: model-box

services:
  vault:
    extends:
      file: ../../applications/ai-ml-applications/model-connectors/deploy/docker/docker-compose.yml
      service: vault
    env_file:
      - ../../applications/ai-ml-applications/model-connectors/deploy/docker/model-box-service.env

  postgres:
    extends:
      file: ../../applications/ai-ml-applications/model-connectors/deploy/docker/docker-compose.yml
      service: postgres
    env_file:
      - ../../applications/ai-ml-applications/model-connectors/deploy/docker/model-box-service.env
      - ../../applications/ai-ml-applications/model-connectors/deploy/docker/model-box-db-secure.env

  service:
    extends:
      file: ../../applications/ai-ml-applications/model-connectors/deploy/docker/docker-compose.yml
      service: service
    env_file:
      - ../../applications/ai-ml-applications/model-connectors/deploy/docker/model-box-service.env
      - ../../applications/ai-ml-applications/model-connectors/deploy/docker/model-box-service-secure.env

  ui:
    extends:
      file: ../../applications/ai-ml-applications/model-connectors/deploy/docker/docker-compose.yml
      service: ui
    env_file:
      - ../../applications/ai-ml-applications/model-connectors/deploy/docker/model-box-ui.env

  playwright-mcp:
    extends:
      file: ../../applications/ai-ml-applications/model-connectors/deploy/docker/docker-compose.yml
      service: playwright-mcp
    env_file:
      - ../../applications/ai-ml-applications/model-connectors/deploy/docker/model-box-service.env

volumes:
  model-connectors-vault-data:
    name: model-connectors-vault-data
  model-connectors-postgres-data:
    name: model-connectors-postgres-data

networks:
  model-box-net:
    name: model-box-net
    external: true
