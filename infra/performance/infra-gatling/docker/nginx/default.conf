server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    index index.html;

    # Root landing page (/)
    location = / {
        root /reports;
        try_files /index.html /__startup.html;
    }

    # Reports endpoint without trailing slash.
    location = /reports {
        return 302 /reports/;
    }

    # Reports endpoint (/reports/) - serves index.html from /reports.
    location = /reports/ {
        root /reports;
        try_files /index.html /__startup.html;
    }

    # Reports endpoint prefix for nested routes.
    location /reports {
        alias /reports;
        index index.html;
        try_files $uri $uri/ /reports/index.html /__startup.html;
    }

    # Startup fallback page shown when reports are not generated yet.
    location = /__startup.html {
        root /usr/share/nginx/html;
    }

    # Backward-compatible runs endpoint: redirect to canonical /reports/runs path.
    location = /runs {
        return 302 /reports/runs/;
    }

    location /runs/ {
        rewrite ^/runs/(.*)$ /reports/runs/$1 redirect;
    }

    location /reports/runs/ {
        alias /reports/runs/;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $request_filename $request_filename/ =404;
    }

    # Default 404 for unmatched paths
    location / {
        root /reports;
        return 404;
    }
}