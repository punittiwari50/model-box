server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    index index.html;

    # Root landing page (/)
    location = / {
        root /reports;
        try_files /index.html =404;
    }

    # Reports endpoint (/reports) - serves index.html from /reports
    location /reports {
        alias /reports;
        index index.html;
        try_files $uri $uri/ /reports/index.html =404;
    }

    # Reports runs directory (/runs/ or /reports/runs/)
    location /runs/ {
        alias /reports/runs/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /reports/runs/ {
        alias /reports/runs/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Default 404 for unmatched paths
    location / {
        root /reports;
        return 404;
    }
}