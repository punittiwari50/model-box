# Ollama GPU Runtime Compose Configuration
#
# Model Storage & Persistence:
#   - Host volume: ./volumes/ollama (portable, project-relative, host-safe)
#   - Container mount: /models (read-write, bidirectional)
#   - GPU-friendly concurrency and queue sizing tuned for RTX 5080-class workloads
#
# GPU Mode:
#   - gpus: all exposes all GPU devices to the container
#   - NVIDIA_VISIBLE_DEVICES=all ensures the full GPU is available to the Ollama runtime
#   - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics supports both inference and tooling

name: model-box

services:
  ollama:
    container_name: ollama-model-service-gpu
    image: ${COMPOSE_OLLAMA_IMAGE:-model-box-ollama:latest}
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    gpus: all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 2048
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    shm_size: ${COMPOSE_SHM_SIZE:-2g}
    cpus: ${COMPOSE_CPUS:-8}
    mem_limit: ${COMPOSE_MEM_LIMIT:-20g}
    mem_reservation: ${COMPOSE_MEM_RESERVATION:-12g}
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-0.0.0.0:11434}
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: ${OLLAMA_NO_CLOUD:-true}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-256}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,graphics}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${COMPOSE_HOST_PORT:-11435}:${COMPOSE_CONTAINER_PORT:-11434}"
    volumes:
      - type: bind
        source: ${COMPOSE_OLLAMA_MODELS_HOST:-./volumes/ollama}
        target: /models
        bind:
          create_host_path: true
        read_only: false
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      model-box-net:
        aliases:
          - ollama-model-service-gpu
          - ollama-model-service
          - ollama
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        mode: "non-blocking"
        max-buffer-size: "4m"
    build:
      context: ../../..
      dockerfile: infra/ollama/docker/Dockerfile.ollama
      args:
        BASE_IMAGE: ${OLLAMA_BASE_IMAGE:-ollama/ollama:latest}

networks:
  model-box-net:
    name: model-box-net
    driver: bridge
    attachable: true
