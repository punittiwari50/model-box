# Ollama CPU Runtime Compose Configuration
#
# Model Storage & Persistence:
#   - Host volume: ./volumes/ollama (portable, project-relative, host-safe)
#   - Container mount: /models (read-write, bidirectional)
#   - Lower CPU and memory limits keep host responsiveness during sustained background loads
#
# CPU Mode:
#   - No GPU-specific configuration (fallback mode)
#   - Use when GPU devices are unavailable or when the host is under heavy concurrent load
#   - Same model persistence as GPU mode

name: model-box

services:
  ollama:
    container_name: ollama-model-service-cpu
    image: ${COMPOSE_OLLAMA_IMAGE:-model-box-ollama:latest}
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 1536
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    shm_size: ${COMPOSE_SHM_SIZE:-2g}
    cpus: ${COMPOSE_CPUS:-6}
    mem_limit: ${COMPOSE_MEM_LIMIT:-16g}
    mem_reservation: ${COMPOSE_MEM_RESERVATION:-8g}
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-0.0.0.0:11434}
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: ${OLLAMA_NO_CLOUD:-true}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-20m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${COMPOSE_HOST_PORT:-11435}:${COMPOSE_CONTAINER_PORT:-11434}"
    volumes:
      - type: bind
        source: ${COMPOSE_OLLAMA_MODELS_HOST:-./volumes/ollama}
        target: /models
        bind:
          create_host_path: true
        read_only: false
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      model-box-net:
        aliases:
          - ollama-model-service-cpu
          - ollama-model-service
          - ollama
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        mode: "non-blocking"
        max-buffer-size: "4m"
    build:
      context: ../../..
      dockerfile: infra/ollama/docker/Dockerfile.ollama
      args:
        BASE_IMAGE: ${OLLAMA_BASE_IMAGE:-ollama/ollama:latest}

networks:
  model-box-net:
    name: model-box-net
    driver: bridge
    attachable: true
